# ローカル開発専用の compose 構成。本番環境ではこのファイルを使わないこと。
# 本番は ECS Fargate + Secrets Manager/SSM を前提とし、必要な環境変数の一覧は
# docs/environment-variables.md を参照。
#
# 資格情報は infra/.env から供給する (gitignore 済み)。初回は次を実行:
#   cp infra/.env.example infra/.env
services:
  postgres:
    restart: unless-stopped
    build:
      context: ./postgres
    image: web-gis-postgis:16-3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis}
      POSTGRES_USER: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
    # ホストへの公開はローカル開発用にループバックのみ。本番では公開しないこと
    # (API の認可を迂回して DB へ直接アクセスできてしまう)。
    # ホスト側で 5432 が使用中の場合は POSTGRES_HOST_PORT で変更できる
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # initdb (初回のみ) では拡張・スキーマ作成と、app テーブルに依存しない
      # GIS データ (010) だけを投入する。テーブル DDL は API 起動時の
      # Flyway マイグレーションが適用し、app テーブルに依存するシード
      # (020/040/050/060/070) はその後に seed サービスが投入する
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./postgres/010-seed-tokyo-gis-data.sql.gz:/docker-entrypoint-initdb.d/010-seed-tokyo-gis-data.sql.gz:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gis} -d ${POSTGRES_DB:-gis}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 開発用シードの one-shot 投入 (Flyway マイグレーション適用後に app テーブルへ投入する)。
  # 各シードはセンチネル行で冪等化済みのため、up を繰り返しても再適用しない。
  # 本番構成ではこのサービスを含めないこと
  seed:
    build:
      context: ./postgres
    image: web-gis-postgis:16-3
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-gis}
      PGUSER: ${POSTGRES_USER:-gis}
      PGPASSWORD: ${POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
    entrypoint: ["bash", "/seed/seed-dev-data.sh"]
    volumes:
      - ./postgres:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  martin:
    restart: unless-stopped
    image: ghcr.io/maplibre/martin:1.3.1
    environment:
      # パスワードは URL に埋め込むため、dev 既定以外を使う場合は URL 予約文字を避けること
      DATABASE_URL: postgres://${POSTGRES_USER:-gis}:${POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}@postgres:5432/${POSTGRES_DB:-gis}
    command: ["--config", "/config/martin.yaml"]
    # タイルは API (/api/tiles) 経由で配信する。Martin の直接公開は API の認可を
    # 迂回する経路になるため、ローカル開発用にループバックのみに限定する
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./martin/martin.yaml:/config/martin.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.2
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
      KC_HTTP_PORT: "8080"
    # start-dev と realm import (開発ユーザー・ROPC 込み) はローカル開発専用。
    # 本番 realm の要件は docs/environment-variables.md の ROPC / dev シードの節を参照
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  api:
    restart: unless-stopped
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gis}
      DATABASE_USER: ${POSTGRES_USER:-gis}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
      UPLOAD_DIR: /data/uploads
      # アップロード保存先 (local | s3)。dev 既定は従来どおり local (volume 共有)。
      # S3 経路を試す場合は infra/.env で UPLOAD_STORAGE=s3 にして
      # `docker compose --profile s3 up` で MinIO を同時に起動する。
      # 本番は UPLOAD_STORAGE=s3 + 実 S3 (エンドポイント上書きなし、認証はタスクロール)
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-local}
      S3_BUCKET: ${S3_BUCKET:-gis-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      # URL 系はすべて localhost = dev 専用の値。本番 (CloudFront/ALB 配下) では
      # 公開 HTTPS URL を注入する (一覧と信頼境界は docs/reverse-proxy.md)
      API_PUBLIC_URL: http://localhost:8080
      WEB_ORIGIN: http://localhost:5173
      # iss クレームはブラウザから見た Keycloak の URL、JWKS の取得はコンテナ間ネットワーク経由
      OIDC_ISSUER: http://localhost:8081/realms/gis
      OIDC_AUDIENCE: gis-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/gis/protocol/openid-connect/certs
      AUTH_ADMIN_EMAILS: admin@gis.example
      # dev は API を直接公開するため X-Forwarded-* を信頼しない (0 = プラグイン無効)。
      # 本番は信頼できるプロキシ段数 (例: CloudFront+ALB=2) を設定する
      TRUSTED_PROXY_COUNT: "0"
      # ジョブ実行基盤 (issue #24)。既定は従来どおり polling + API 内蔵ランナー。
      # SQS 経路を試す場合は infra/.env で JOB_QUEUE_MODE=sqs / ANALYSIS_RUNNER_MODE=external
      # にして `docker compose --profile sqs up` で ElasticMQ と analysis-worker を同時に起動する。
      # 本番は JOB_QUEUE_MODE=sqs + 実 SQS (エンドポイント上書きなし、認証はタスクロール)
      JOB_QUEUE_MODE: ${JOB_QUEUE_MODE:-polling}
      ANALYSIS_RUNNER_MODE: ${ANALYSIS_RUNNER_MODE:-in-process}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-http://elasticmq:9324}
      SQS_ANALYSIS_QUEUE_URL: ${SQS_ANALYSIS_QUEUE_URL:-http://elasticmq:9324/000000000000/analysis-jobs}
      SQS_IMPORT_QUEUE_URL: ${SQS_IMPORT_QUEUE_URL:-http://elasticmq:9324/000000000000/import-jobs}
      SQS_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "8080:8080"
    volumes:
      - ../data:/data
    depends_on:
      postgres:
        condition: service_healthy

  worker-gis:
    restart: unless-stopped
    build:
      context: ../apps/worker-gis
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-gis}
      PGUSER: ${POSTGRES_USER:-gis}
      PGPASSWORD: ${POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
      POLL_INTERVAL_SECONDS: "2"
      # ジョブ起動の駆動方式 (issue #24)。既定 polling は従来どおりの DB ポーリング。
      # sqs は --profile sqs (ElasticMQ) とセットで opt-in する
      JOB_QUEUE_MODE: ${JOB_QUEUE_MODE:-polling}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-http://elasticmq:9324}
      SQS_IMPORT_QUEUE_URL: ${SQS_IMPORT_QUEUE_URL:-http://elasticmq:9324/000000000000/import-jobs}
      # upload_path が s3:// のジョブを読むための S3 設定 (api 側と対で切り替える)
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      AWS_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - ../data:/data
    depends_on:
      postgres:
        condition: service_healthy

  # SQS 経路の開発用キュー (SQS 互換の ElasticMQ)。既定では起動しない:
  #   infra/.env に JOB_QUEUE_MODE=sqs / ANALYSIS_RUNNER_MODE=external を設定した上で
  #   docker compose -f infra/docker-compose.yml --profile sqs up --build
  # 本番は実 SQS を使うため、このサービスは本番構成に含めない
  elasticmq:
    profiles: ["sqs"]
    restart: unless-stopped
    image: softwaremill/elasticmq-native:1.6.16
    # ローカル開発用にループバックのみ公開 (キューの中身は認可を持たない)
    ports:
      - "127.0.0.1:9324:9324"
    volumes:
      - ./elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro

  # 分析ジョブ実行ワーカー (issue #24)。api と同イメージで command のみ
  # bin/analysis-worker に差し替える (本番 ECS でも同じ分離構成)。
  # --profile sqs のときは api 側を ANALYSIS_RUNNER_MODE=external にして重複起動を避ける
  analysis-worker:
    profiles: ["sqs"]
    restart: unless-stopped
    build:
      context: ../apps/api
    command: ["/app/bin/analysis-worker"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gis}
      DATABASE_USER: ${POSTGRES_USER:-gis}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
      JOB_QUEUE_MODE: ${JOB_QUEUE_MODE:-sqs}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-http://elasticmq:9324}
      SQS_ANALYSIS_QUEUE_URL: ${SQS_ANALYSIS_QUEUE_URL:-http://elasticmq:9324/000000000000/analysis-jobs}
      SQS_REGION: ${S3_REGION:-us-east-1}
      # ElasticMQ は資格情報を検証しないが AWS SDK の既定チェーンが解決可能な値を要求する
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dev}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started

  # S3 経路の開発用オブジェクトストレージ (S3 互換)。既定では起動しない:
  #   UPLOAD_STORAGE=s3 を infra/.env に設定した上で
  #   docker compose -f infra/docker-compose.yml --profile s3 up --build
  # 本番は実 S3 を使うため、このサービスは本番構成に含めない
  minio:
    profiles: ["s3"]
    restart: unless-stopped
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret}
    # ローカル開発用にループバックのみ公開 (9001 は管理コンソール)
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  # アップロード用バケットの one-shot 作成 (冪等: --ignore-existing)
  minio-init:
    profiles: ["s3"]
    restart: "no"
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-gis-uploads}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set dev http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb --ignore-existing "dev/$$S3_BUCKET"
    depends_on:
      - minio

  # Feedbackの唯一の正本。ローカル検証でもSPAはブラウザ拡張ではなく、同梱pluginから
  # same-origin gatewayを経由してこのRedmineへissueを作る。
  feedback-redmine-db:
    restart: unless-stopped
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: ${FEEDBACK_REDMINE_DB_PASSWORD:?infra/.env のFEEDBACK_REDMINE_DB_PASSWORDが必要です}
    volumes:
      - feedback-redmine-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 5s
      timeout: 5s
      retries: 30

  feedback-redmine:
    restart: unless-stopped
    image: redmine:7.0.0-bookworm@sha256:0ec7a0f75c42b89aab6872bfd73cfcce4547476da6a7ee065af2b960237bfb5c
    environment:
      REDMINE_DB_POSTGRES: feedback-redmine-db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${FEEDBACK_REDMINE_DB_PASSWORD:?infra/.env のFEEDBACK_REDMINE_DB_PASSWORDが必要です}
      REDMINE_SECRET_KEY_BASE: ${FEEDBACK_REDMINE_SECRET_KEY_BASE:?infra/.env のFEEDBACK_REDMINE_SECRET_KEY_BASEが必要です}
      REDMINE_LANG: ja
    ports:
      - "127.0.0.1:${FEEDBACK_REDMINE_HOST_PORT:-3001}:3000"
    volumes:
      - feedback-redmine-files:/usr/src/redmine/files
    depends_on:
      feedback-redmine-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # Redmineのproject/tracker/11 custom fields/integration userを冪等作成するローカル専用one-shot。
  # API keyそのものは標準出力へ出さない。
  feedback-redmine-bootstrap:
    restart: "no"
    image: redmine:7.0.0-bookworm@sha256:0ec7a0f75c42b89aab6872bfd73cfcce4547476da6a7ee065af2b960237bfb5c
    # official entrypointにdatabase.yml生成を任せた後、Rails runnerだけ差し替える。
    command: ["bundle", "exec", "rails", "runner", "/bootstrap/bootstrap.rb"]
    working_dir: /usr/src/redmine
    environment:
      RAILS_ENV: production
      REDMINE_DB_POSTGRES: feedback-redmine-db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${FEEDBACK_REDMINE_DB_PASSWORD:?infra/.env のFEEDBACK_REDMINE_DB_PASSWORDが必要です}
      REDMINE_SECRET_KEY_BASE: ${FEEDBACK_REDMINE_SECRET_KEY_BASE:?infra/.env のFEEDBACK_REDMINE_SECRET_KEY_BASEが必要です}
      FEEDBACK_REDMINE_GATEWAY_API_KEY: ${FEEDBACK_REDMINE_GATEWAY_API_KEY:?infra/.env のFEEDBACK_REDMINE_GATEWAY_API_KEYが必要です}
      FEEDBACK_REDMINE_PROJECT_ID: ${FEEDBACK_REDMINE_PROJECT_ID:?infra/.env のFEEDBACK_REDMINE_PROJECT_IDが必要です}
      FEEDBACK_REDMINE_TRACKER_ID: ${FEEDBACK_REDMINE_TRACKER_ID:?infra/.env のFEEDBACK_REDMINE_TRACKER_IDが必要です}
      FEEDBACK_REDMINE_DEFAULT_PRIORITY_ID: ${FEEDBACK_REDMINE_DEFAULT_PRIORITY_ID:?infra/.env のFEEDBACK_REDMINE_DEFAULT_PRIORITY_IDが必要です}
      FEEDBACK_REDMINE_OPEN_STATUS_ID: ${FEEDBACK_REDMINE_OPEN_STATUS_ID:?infra/.env のFEEDBACK_REDMINE_OPEN_STATUS_IDが必要です}
      FEEDBACK_REDMINE_CLOSED_STATUS_ID: ${FEEDBACK_REDMINE_CLOSED_STATUS_ID:?infra/.env のFEEDBACK_REDMINE_CLOSED_STATUS_IDが必要です}
      FEEDBACK_REDMINE_CUSTOM_FIELD_IDS_JSON: ${FEEDBACK_REDMINE_CUSTOM_FIELD_IDS_JSON:?infra/.env のFEEDBACK_REDMINE_CUSTOM_FIELD_IDS_JSONが必要です}
    volumes:
      - ./redmine:/bootstrap:ro
    depends_on:
      feedback-redmine:
        condition: service_healthy

  feedback-redmine-gateway:
    restart: unless-stopped
    image: ghcr.io/geibee/feedback-redmine-gateway:1.0.0-alpha.6@sha256:dffefd7871332a021d8ede507e1bfbbdac113474e1c5090178eeea0f11f86b03
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: development
      FEEDBACK_PUBLIC_ORIGIN: ${FEEDBACK_PUBLIC_ORIGIN:?infra/.env のFEEDBACK_PUBLIC_ORIGINが必要です}
      # 公開gatewayのenv-only profile。追加のprofile fileやconsumer側server実装を持たない。
      FEEDBACK_REDMINE_GATEWAY_PROFILE_JSON: >-
        {"profileId":"${FEEDBACK_REDMINE_PROFILE_ID:?infra/.env のFEEDBACK_REDMINE_PROFILE_IDが必要です}","clientProfile":{"schemaVersion":"1","id":"${FEEDBACK_REDMINE_PROFILE_ID:?infra/.env のFEEDBACK_REDMINE_PROFILE_IDが必要です}","displayName":"${FEEDBACK_REDMINE_PROFILE_DISPLAY_NAME:?infra/.env のFEEDBACK_REDMINE_PROFILE_DISPLAY_NAMEが必要です}","applicationKey":"${FEEDBACK_REDMINE_APPLICATION_KEY:?infra/.env のFEEDBACK_REDMINE_APPLICATION_KEYが必要です}","environmentKey":"${FEEDBACK_REDMINE_ENVIRONMENT_KEY:?infra/.env のFEEDBACK_REDMINE_ENVIRONMENT_KEYが必要です}","externalWorkspaceKey":"${FEEDBACK_REDMINE_WORKSPACE_KEY:?infra/.env のFEEDBACK_REDMINE_WORKSPACE_KEYが必要です}","perspectives":${FEEDBACK_REDMINE_PERSPECTIVES_JSON:?infra/.env のFEEDBACK_REDMINE_PERSPECTIVES_JSONが必要です},"capture":{"enabled":${FEEDBACK_REDMINE_CAPTURE_ENABLED:?infra/.env のFEEDBACK_REDMINE_CAPTURE_ENABLEDが必要です},"maximumUploadBytes":${FEEDBACK_REDMINE_MAXIMUM_UPLOAD_BYTES:?infra/.env のFEEDBACK_REDMINE_MAXIMUM_UPLOAD_BYTESが必要です},"contentTypes":["image/png","image/webp"]},"attachments":{"maximumInlinePreviewBytes":${FEEDBACK_REDMINE_MAXIMUM_INLINE_PREVIEW_BYTES:?infra/.env のFEEDBACK_REDMINE_MAXIMUM_INLINE_PREVIEW_BYTESが必要です},"maximumDownloadBytes":${FEEDBACK_REDMINE_MAXIMUM_DOWNLOAD_BYTES:?infra/.env のFEEDBACK_REDMINE_MAXIMUM_DOWNLOAD_BYTESが必要です}}},"redmineBaseUrl":"${FEEDBACK_REDMINE_BASE_URL:?infra/.env のFEEDBACK_REDMINE_BASE_URLが必要です}","projectId":${FEEDBACK_REDMINE_PROJECT_ID:?infra/.env のFEEDBACK_REDMINE_PROJECT_IDが必要です},"trackerId":${FEEDBACK_REDMINE_TRACKER_ID:?infra/.env のFEEDBACK_REDMINE_TRACKER_IDが必要です},"isPrivate":${FEEDBACK_REDMINE_IS_PRIVATE:?infra/.env のFEEDBACK_REDMINE_IS_PRIVATEが必要です},"defaultPriorityId":${FEEDBACK_REDMINE_DEFAULT_PRIORITY_ID:?infra/.env のFEEDBACK_REDMINE_DEFAULT_PRIORITY_IDが必要です},"customFieldIds":${FEEDBACK_REDMINE_CUSTOM_FIELD_IDS_JSON:?infra/.env のFEEDBACK_REDMINE_CUSTOM_FIELD_IDS_JSONが必要です},"authorizationMode":"resource-scoped","showRedmineLink":${FEEDBACK_REDMINE_SHOW_REDMINE_LINK:?infra/.env のFEEDBACK_REDMINE_SHOW_REDMINE_LINKが必要です},"closedStatusIds":${FEEDBACK_REDMINE_CLOSED_STATUS_IDS_JSON:?infra/.env のFEEDBACK_REDMINE_CLOSED_STATUS_IDS_JSONが必要です},"secretRef":"FEEDBACK_REDMINE_GATEWAY_API_KEY"}
      FEEDBACK_REDMINE_GATEWAY_API_KEY: ${FEEDBACK_REDMINE_GATEWAY_API_KEY:?infra/.env のFEEDBACK_REDMINE_GATEWAY_API_KEYが必要です}
      FEEDBACK_PARTICIPANT_SIGNING_KEY: ${FEEDBACK_PARTICIPANT_SIGNING_KEY:?infra/.env のFEEDBACK_PARTICIPANT_SIGNING_KEYが必要です}
    ports:
      - "127.0.0.1:${FEEDBACK_REDMINE_GATEWAY_HOST_PORT:-8082}:8080"
    depends_on:
      feedback-redmine:
        condition: service_healthy
      feedback-redmine-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8080/internal/feedback-redmine/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_FEEDBACK_REDMINE_APPLICATION_KEY: ${FEEDBACK_REDMINE_APPLICATION_KEY:?infra/.env のFEEDBACK_REDMINE_APPLICATION_KEYが必要です}
        VITE_FEEDBACK_REDMINE_ENVIRONMENT_KEY: ${FEEDBACK_REDMINE_ENVIRONMENT_KEY:?infra/.env のFEEDBACK_REDMINE_ENVIRONMENT_KEYが必要です}
        VITE_FEEDBACK_REDMINE_WORKSPACE_KEY: ${FEEDBACK_REDMINE_WORKSPACE_KEY:?infra/.env のFEEDBACK_REDMINE_WORKSPACE_KEYが必要です}
        VITE_FEEDBACK_HOST_RELEASE: ${FEEDBACK_HOST_RELEASE:?infra/.env のFEEDBACK_HOST_RELEASEが必要です}
    environment:
      FEEDBACK_REDMINE_ENABLED: ${FEEDBACK_REDMINE_ENABLED:-true}
      FEEDBACK_REDMINE_PROFILE_ID: ${FEEDBACK_REDMINE_PROFILE_ID:?infra/.env のFEEDBACK_REDMINE_PROFILE_IDが必要です}
      FEEDBACK_REDMINE_GATEWAY_BASE_PATH: ${FEEDBACK_REDMINE_GATEWAY_BASE_PATH:-/internal/feedback-redmine/v1}
    # ホスト側で 5173 が使用中の場合は WEB_HOST_PORT で変更できる
    # (OIDC のリダイレクト URI と CORS は 5173 前提のため、UI を使う場合は既定のままにする)
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_started
      martin:
        condition: service_started
      feedback-redmine-gateway:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  feedback-redmine-db-data:
  feedback-redmine-files:
