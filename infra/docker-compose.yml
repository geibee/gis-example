# ローカル開発専用の compose 構成。本番環境ではこのファイルを使わないこと。
# 本番は ECS Fargate + Secrets Manager/SSM を前提とし、必要な環境変数の一覧は
# docs/environment-variables.md を参照。
#
# 資格情報は infra/.env から供給する (gitignore 済み)。初回は次を実行:
#   cp infra/.env.example infra/.env
services:
  postgres:
    restart: unless-stopped
    build:
      context: ./postgres
    image: web-gis-postgis:16-3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis}
      POSTGRES_USER: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
    # ホストへの公開はローカル開発用にループバックのみ。本番では公開しないこと
    # (API の認可を迂回して DB へ直接アクセスできてしまう)。
    # ホスト側で 5432 が使用中の場合は POSTGRES_HOST_PORT で変更できる
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # initdb (初回のみ) では拡張・スキーマ作成と、app テーブルに依存しない
      # GIS データ (010) だけを投入する。テーブル DDL は API 起動時の
      # Flyway マイグレーションが適用し、app テーブルに依存するシード
      # (020/040/050/060/070) はその後に seed サービスが投入する
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./postgres/010-seed-tokyo-gis-data.sql.gz:/docker-entrypoint-initdb.d/010-seed-tokyo-gis-data.sql.gz:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gis} -d ${POSTGRES_DB:-gis}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Web GIS の PostGIS から物理分離した Feedback Service 専用 PostgreSQL。
  # `--profile feedback` のときだけ起動し、PostGIS/init.sql/業務 seed は一切マウントしない
  feedback-postgres:
    profiles: ["feedback"]
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${FEEDBACK_POSTGRES_DB:-feedback}
      POSTGRES_USER: ${FEEDBACK_POSTGRES_USER:-feedback}
      POSTGRES_PASSWORD: ${FEEDBACK_POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
    ports:
      - "127.0.0.1:${FEEDBACK_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - feedback-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FEEDBACK_POSTGRES_USER:-feedback} -d ${FEEDBACK_POSTGRES_DB:-feedback}"]
      interval: 5s
      timeout: 5s
      retries: 20

  feedback-service:
    profiles: ["feedback"]
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/feedback-service/Dockerfile
    environment:
      FEEDBACK_PORT: "8090"
      FEEDBACK_DATABASE_URL: jdbc:postgresql://feedback-postgres:5432/${FEEDBACK_POSTGRES_DB:-feedback}
      FEEDBACK_DATABASE_USER: ${FEEDBACK_POSTGRES_USER:-feedback}
      FEEDBACK_DATABASE_PASSWORD: ${FEEDBACK_POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
      FEEDBACK_OIDC_ISSUER: http://localhost:8081/realms/gis
      FEEDBACK_OIDC_AUDIENCE: feedback-service
      FEEDBACK_OIDC_JWKS_URL: http://keycloak:8080/realms/gis/protocol/openid-connect/certs
      FEEDBACK_ALLOW_INSECURE_HTTP: "1"
      FEEDBACK_EVIDENCE_STORAGE: local
      FEEDBACK_EVIDENCE_DIR: /data/evidence
      FEEDBACK_EXPORT_DIR: /data/exports
      FEEDBACK_NOTIFICATION_ENCRYPTION_KEY: ${FEEDBACK_NOTIFICATION_ENCRYPTION_KEY:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
    ports:
      - "127.0.0.1:${FEEDBACK_SERVICE_HOST_PORT:-8090}:8090"
    volumes:
      - feedback-evidence-data:/data/evidence
      - feedback-export-data:/data/exports
    depends_on:
      feedback-postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  # 初回 tenant/application/environment/workspace/admin を作る one-shot provisioning CLI。
  # 以後の manifest/membership は Feedback Admin Console から管理する
  feedback-bootstrap:
    profiles: ["feedback"]
    restart: "no"
    build:
      context: ..
      dockerfile: apps/feedback-service/Dockerfile
    command: ["/app/bin/feedback-bootstrap"]
    environment:
      FEEDBACK_DATABASE_URL: jdbc:postgresql://feedback-postgres:5432/${FEEDBACK_POSTGRES_DB:-feedback}
      FEEDBACK_DATABASE_USER: ${FEEDBACK_POSTGRES_USER:-feedback}
      FEEDBACK_DATABASE_PASSWORD: ${FEEDBACK_POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
      FEEDBACK_BOOTSTRAP_TENANT_KEY: local
      FEEDBACK_BOOTSTRAP_TENANT_DISPLAY_NAME: ローカル開発
      FEEDBACK_BOOTSTRAP_APPLICATION_KEY: web-gis
      FEEDBACK_BOOTSTRAP_APPLICATION_DISPLAY_NAME: Web GIS
      FEEDBACK_BOOTSTRAP_ENVIRONMENT_KEY: local
      FEEDBACK_BOOTSTRAP_ENVIRONMENT_BASE_URL: http://localhost:5173
      FEEDBACK_BOOTSTRAP_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      FEEDBACK_BOOTSTRAP_EXTERNAL_WORKSPACE_KEY: 00000000-0000-0000-0000-000000000000
      FEEDBACK_BOOTSTRAP_WORKSPACE_DISPLAY_NAME: デモプロジェクト
      FEEDBACK_BOOTSTRAP_ISSUER: http://localhost:8081/realms/gis
      FEEDBACK_BOOTSTRAP_SUBJECT: a0000000-0000-4000-8000-000000000001
      FEEDBACK_BOOTSTRAP_EMAIL: admin@gis.example
      FEEDBACK_BOOTSTRAP_DISPLAY_NAME: GIS Admin
      FEEDBACK_BOOTSTRAP_PERMISSIONS: feedback.read,feedback.comment,feedback.manage,feedback.admin
    depends_on:
      feedback-postgres:
        condition: service_healthy

  feedback-notification-worker:
    profiles: ["feedback"]
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/feedback-service/Dockerfile
    command: ["/app/bin/feedback-notification-worker"]
    environment:
      FEEDBACK_DATABASE_URL: jdbc:postgresql://feedback-postgres:5432/${FEEDBACK_POSTGRES_DB:-feedback}
      FEEDBACK_DATABASE_USER: ${FEEDBACK_POSTGRES_USER:-feedback}
      FEEDBACK_DATABASE_PASSWORD: ${FEEDBACK_POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
      FEEDBACK_NOTIFICATION_ENCRYPTION_KEY: ${FEEDBACK_NOTIFICATION_ENCRYPTION_KEY:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
    depends_on:
      feedback-bootstrap:
        condition: service_completed_successfully

  feedback-export-worker:
    profiles: ["feedback"]
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/feedback-service/Dockerfile
    command: ["/app/bin/feedback-export-worker"]
    environment:
      FEEDBACK_DATABASE_URL: jdbc:postgresql://feedback-postgres:5432/${FEEDBACK_POSTGRES_DB:-feedback}
      FEEDBACK_DATABASE_USER: ${FEEDBACK_POSTGRES_USER:-feedback}
      FEEDBACK_DATABASE_PASSWORD: ${FEEDBACK_POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
      FEEDBACK_EVIDENCE_STORAGE: local
      FEEDBACK_EVIDENCE_DIR: /data/evidence
      FEEDBACK_EXPORT_DIR: /data/exports
      FEEDBACK_BACKUP_KEY_PREFIX: backups/
    volumes:
      - feedback-evidence-data:/data/evidence:ro
      - feedback-export-data:/data/exports
    depends_on:
      feedback-bootstrap:
        condition: service_completed_successfully

  feedback-retention-worker:
    profiles: ["feedback"]
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/feedback-service/Dockerfile
    command: ["/app/bin/feedback-retention-worker"]
    environment:
      FEEDBACK_DATABASE_URL: jdbc:postgresql://feedback-postgres:5432/${FEEDBACK_POSTGRES_DB:-feedback}
      FEEDBACK_DATABASE_USER: ${FEEDBACK_POSTGRES_USER:-feedback}
      FEEDBACK_DATABASE_PASSWORD: ${FEEDBACK_POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
      FEEDBACK_EVIDENCE_STORAGE: local
      FEEDBACK_EVIDENCE_DIR: /data/evidence
      FEEDBACK_EXPORT_DIR: /data/exports
    volumes:
      - feedback-evidence-data:/data/evidence
      - feedback-export-data:/data/exports
    depends_on:
      feedback-bootstrap:
        condition: service_completed_successfully

  feedback-admin:
    profiles: ["feedback"]
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/feedback-admin/Dockerfile
      args:
        VITE_FEEDBACK_API_BASE: http://localhost:${FEEDBACK_SERVICE_HOST_PORT:-8090}/feedback/v1
        VITE_FEEDBACK_ADMIN_OIDC_AUTHORITY: http://localhost:8081/realms/gis
        VITE_FEEDBACK_ADMIN_OIDC_CLIENT_ID: feedback-admin
        VITE_FEEDBACK_ADMIN_OIDC_REDIRECT_URI: http://localhost:${FEEDBACK_ADMIN_HOST_PORT:-5174}/
        FEEDBACK_ADMIN_APPLICATION: web-gis
        FEEDBACK_ADMIN_ENVIRONMENT: local
        FEEDBACK_ADMIN_WORKSPACE: 00000000-0000-0000-0000-000000000000
        CSP_CONNECT_SRC_EXTRA: http://localhost:${FEEDBACK_SERVICE_HOST_PORT:-8090} http://localhost:8081
    ports:
      - "127.0.0.1:${FEEDBACK_ADMIN_HOST_PORT:-5174}:80"
    depends_on:
      feedback-service:
        condition: service_started
      keycloak:
        condition: service_started

  # 開発用シードの one-shot 投入 (Flyway マイグレーション適用後に app テーブルへ投入する)。
  # 各シードはセンチネル行で冪等化済みのため、up を繰り返しても再適用しない。
  # 本番構成ではこのサービスを含めないこと
  seed:
    build:
      context: ./postgres
    image: web-gis-postgis:16-3
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-gis}
      PGUSER: ${POSTGRES_USER:-gis}
      PGPASSWORD: ${POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
    entrypoint: ["bash", "/seed/seed-dev-data.sh"]
    volumes:
      - ./postgres:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  martin:
    restart: unless-stopped
    image: ghcr.io/maplibre/martin:1.3.1
    environment:
      # パスワードは URL に埋め込むため、dev 既定以外を使う場合は URL 予約文字を避けること
      DATABASE_URL: postgres://${POSTGRES_USER:-gis}:${POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}@postgres:5432/${POSTGRES_DB:-gis}
    command: ["--config", "/config/martin.yaml"]
    # タイルは API (/api/tiles) 経由で配信する。Martin の直接公開は API の認可を
    # 迂回する経路になるため、ローカル開発用にループバックのみに限定する
    # ホスト側で 3000 が使用中の場合は MARTIN_HOST_PORT で変更できる。
    # api からは常に compose 内の martin:3000 へ接続するため、変更はホスト直アクセスだけに影響する。
    ports:
      - "127.0.0.1:${MARTIN_HOST_PORT:-3000}:3000"
    volumes:
      - ./martin/martin.yaml:/config/martin.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.2
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
      KC_HTTP_PORT: "8080"
    # start-dev と realm import (開発ユーザー・ROPC 込み) はローカル開発専用。
    # 本番 realm の要件は docs/environment-variables.md の ROPC / dev シードの節を参照
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  api:
    restart: unless-stopped
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gis}
      DATABASE_USER: ${POSTGRES_USER:-gis}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
      UPLOAD_DIR: /data/uploads
      # アップロード保存先 (local | s3)。dev 既定は従来どおり local (volume 共有)。
      # S3 経路を試す場合は infra/.env で UPLOAD_STORAGE=s3 にして
      # `docker compose --profile s3 up` で MinIO を同時に起動する。
      # 本番は UPLOAD_STORAGE=s3 + 実 S3 (エンドポイント上書きなし、認証はタスクロール)
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-local}
      S3_BUCKET: ${S3_BUCKET:-gis-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      # URL 系はすべて localhost = dev 専用の値。本番 (CloudFront/ALB 配下) では
      # 公開 HTTPS URL を注入する (一覧と信頼境界は docs/reverse-proxy.md)
      # TileJSONをブラウザが取得する公開Webオリジンへ揃える。APIコンテナの直公開URLを
      # 返すとwebのCSP connect-src 'self'を外れ、MapLibreのタイル取得が拒否される。
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:5173}
      WEB_ORIGIN: http://localhost:5173
      # iss クレームはブラウザから見た Keycloak の URL、JWKS の取得はコンテナ間ネットワーク経由
      OIDC_ISSUER: http://localhost:8081/realms/gis
      OIDC_AUDIENCE: gis-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/gis/protocol/openid-connect/certs
      AUTH_ADMIN_EMAILS: admin@gis.example
      # dev は API を直接公開するため X-Forwarded-* を信頼しない (0 = プラグイン無効)。
      # 本番は信頼できるプロキシ段数 (例: CloudFront+ALB=2) を設定する
      TRUSTED_PROXY_COUNT: "0"
      # ジョブ実行基盤 (issue #24)。既定は従来どおり polling + API 内蔵ランナー。
      # SQS 経路を試す場合は infra/.env で JOB_QUEUE_MODE=sqs / ANALYSIS_RUNNER_MODE=external
      # にして `docker compose --profile sqs up` で ElasticMQ と analysis-worker を同時に起動する。
      # 本番は JOB_QUEUE_MODE=sqs + 実 SQS (エンドポイント上書きなし、認証はタスクロール)
      JOB_QUEUE_MODE: ${JOB_QUEUE_MODE:-polling}
      ANALYSIS_RUNNER_MODE: ${ANALYSIS_RUNNER_MODE:-in-process}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-http://elasticmq:9324}
      SQS_ANALYSIS_QUEUE_URL: ${SQS_ANALYSIS_QUEUE_URL:-http://elasticmq:9324/000000000000/analysis-jobs}
      SQS_IMPORT_QUEUE_URL: ${SQS_IMPORT_QUEUE_URL:-http://elasticmq:9324/000000000000/import-jobs}
      SQS_REGION: ${S3_REGION:-us-east-1}
      # レビュー外部通知は接続先を設定したチャネルだけが管理画面で有効化可能になる
      REVIEW_APP_URL: http://localhost:5173
      REVIEW_EMAIL_FROM: ${REVIEW_EMAIL_FROM:-}
      REVIEW_SES_REGION: ${S3_REGION:-us-east-1}
      REVIEW_TEAMS_WEBHOOK_URL: ${REVIEW_TEAMS_WEBHOOK_URL:-}
      REVIEW_ISSUE_WEBHOOK_URL: ${REVIEW_ISSUE_WEBHOOK_URL:-}
      REVIEW_ISSUE_WEBHOOK_TOKEN: ${REVIEW_ISSUE_WEBHOOK_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      - ../data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  worker-gis:
    restart: unless-stopped
    build:
      context: ../apps/worker-gis
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-gis}
      PGUSER: ${POSTGRES_USER:-gis}
      PGPASSWORD: ${POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
      POLL_INTERVAL_SECONDS: "2"
      # ジョブ起動の駆動方式 (issue #24)。既定 polling は従来どおりの DB ポーリング。
      # sqs は --profile sqs (ElasticMQ) とセットで opt-in する
      JOB_QUEUE_MODE: ${JOB_QUEUE_MODE:-polling}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-http://elasticmq:9324}
      SQS_IMPORT_QUEUE_URL: ${SQS_IMPORT_QUEUE_URL:-http://elasticmq:9324/000000000000/import-jobs}
      # upload_path が s3:// のジョブを読むための S3 設定 (api 側と対で切り替える)
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      AWS_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - ../data:/data
    depends_on:
      postgres:
        condition: service_healthy

  # SQS 経路の開発用キュー (SQS 互換の ElasticMQ)。既定では起動しない:
  #   infra/.env に JOB_QUEUE_MODE=sqs / ANALYSIS_RUNNER_MODE=external を設定した上で
  #   docker compose -f infra/docker-compose.yml --profile sqs up --build
  # 本番は実 SQS を使うため、このサービスは本番構成に含めない
  elasticmq:
    profiles: ["sqs"]
    restart: unless-stopped
    image: softwaremill/elasticmq-native:1.6.16
    # ローカル開発用にループバックのみ公開 (キューの中身は認可を持たない)
    ports:
      - "127.0.0.1:9324:9324"
    volumes:
      - ./elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro

  # 分析ジョブ実行ワーカー (issue #24)。api と同イメージで command のみ
  # bin/analysis-worker に差し替える (本番 ECS でも同じ分離構成)。
  # --profile sqs のときは api 側を ANALYSIS_RUNNER_MODE=external にして重複起動を避ける
  analysis-worker:
    profiles: ["sqs"]
    restart: unless-stopped
    build:
      context: ../apps/api
    command: ["/app/bin/analysis-worker"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gis}
      DATABASE_USER: ${POSTGRES_USER:-gis}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env が未作成です (cp infra/.env.example infra/.env)}
      JOB_QUEUE_MODE: ${JOB_QUEUE_MODE:-sqs}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-http://elasticmq:9324}
      SQS_ANALYSIS_QUEUE_URL: ${SQS_ANALYSIS_QUEUE_URL:-http://elasticmq:9324/000000000000/analysis-jobs}
      SQS_REGION: ${S3_REGION:-us-east-1}
      # ElasticMQ は資格情報を検証しないが AWS SDK の既定チェーンが解決可能な値を要求する
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dev}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started

  # S3 経路の開発用オブジェクトストレージ (S3 互換)。既定では起動しない:
  #   UPLOAD_STORAGE=s3 を infra/.env に設定した上で
  #   docker compose -f infra/docker-compose.yml --profile s3 up --build
  # 本番は実 S3 を使うため、このサービスは本番構成に含めない
  minio:
    profiles: ["s3"]
    restart: unless-stopped
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret}
    # ローカル開発用にループバックのみ公開 (9001 は管理コンソール)
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  # アップロード用バケットの one-shot 作成 (冪等: --ignore-existing)
  minio-init:
    profiles: ["s3"]
    restart: "no"
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-gis-uploads}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set dev http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb --ignore-existing "dev/$$S3_BUCKET"
    depends_on:
      - minio

  web:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_FEEDBACK_API_MODE: ${VITE_FEEDBACK_API_MODE:-legacy}
        VITE_FEEDBACK_API_BASE: ${VITE_FEEDBACK_API_BASE:-/feedback/v1}
        VITE_FEEDBACK_ADMIN_URL: ${VITE_FEEDBACK_ADMIN_URL:-http://localhost:5174/}
        FEEDBACK_APPLICATION: ${VITE_FEEDBACK_APPLICATION_KEY:-web-gis}
        FEEDBACK_ENVIRONMENT: ${VITE_FEEDBACK_ENVIRONMENT_KEY:-local}
    # ホスト側で 5173 が使用中の場合は WEB_HOST_PORT で変更できる
    # (OIDC のリダイレクト URI と CORS は 5173 前提のため、UI を使う場合は既定のままにする)
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    depends_on:
