# push / PR 時の軽量ゲート。scripts/verify.sh を SSoT として再利用する。
#
# - scope ジョブが verify.sh のスコープ判定 (VERIFY_DETECT_ONLY=1) を実行し、
#   api / worker / web ジョブを変更スコープに応じて条件起動する
# - main への push は「変更なし = 全スコープ」判定になり、常にフル検証される
# - PostGIS を要する統合テスト・E2E は本ワークフローの対象外 (将来 nightly に配置する)
name: verify

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  # main は途中コミットも検証したいのでキャンセルしない
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  scope:
    name: 変更スコープ判定
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.detect.outputs.api }}
      feedback: ${{ steps.detect.outputs.feedback }}
      worker: ${{ steps.detect.outputs.worker }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge-base 計算に main の履歴が必要
      - name: verify.sh のスコープ判定を実行
        id: detect
        env:
          VERIFY_BASE_REF: origin/main
          VERIFY_DETECT_ONLY: "1"
        run: bash scripts/verify.sh

  api:
    name: api verify (Kotlin)
    needs: scope
    if: needs.scope.outputs.api == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: 統合 verify (api スコープ)
        env:
          VERIFY_SCOPE: api
        run: bash scripts/verify.sh

  feedback:
    name: feedback extraction verify
    needs: scope
    if: needs.scope.outputs.feedback == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: allowlist抽出物をclean build/test/image buildする
        run: bash scripts/check-feedback-extraction.sh

  worker:
    name: worker verify (Python)
    needs: scope
    if: needs.scope.outputs.worker == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker-gis/requirements.txt
      - name: worker のツールチェーンをインストール
        run: pip install -r apps/worker-gis/requirements.txt ruff mypy pytest
      - name: 統合 verify (worker スコープ)
        env:
          VERIFY_SCOPE: worker
        run: bash scripts/verify.sh

  api-integration:
    name: api integration (PostGIS)
    needs: scope
    if: needs.scope.outputs.api == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: gis
          POSTGRES_PASSWORD: gis
          POSTGRES_DB: gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gis -d gis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: 統合 verify (api / PostGIS)
        env:
          VERIFY_SCOPE: api
          VERIFY_INTEGRATION: "1"
          DATABASE_URL: jdbc:postgresql://localhost:5432/gis
          DATABASE_USER: gis
          DATABASE_PASSWORD: gis
        run: bash scripts/verify.sh

  worker-integration:
    name: worker integration (GDAL + PostGIS)
    needs: scope
    if: needs.scope.outputs.worker == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: gis
          POSTGRES_PASSWORD: gis
          POSTGRES_DB: gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gis -d gis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker-gis/requirements.txt
      - name: GDAL (ogr2ogr) をインストール
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
      - name: worker のツールチェーンをインストール
        run: pip install -r apps/worker-gis/requirements.txt ruff mypy pytest
      - name: 統合 verify (worker / GDAL + PostGIS)
        env:
          VERIFY_SCOPE: worker
          VERIFY_INTEGRATION: "1"
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: gis
          PGUSER: gis
          PGPASSWORD: gis
        run: bash scripts/verify.sh

  feedback-integration:
    name: feedback integration (plain PostgreSQL)
    needs: scope
    if: needs.scope.outputs.feedback == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feedback
          POSTGRES_PASSWORD: feedback
          POSTGRES_DB: feedback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedback -d feedback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: S3互換storage (MinIO) を起動
        run: |
          docker run -d --name feedback-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=feedback-minio \
            -e MINIO_ROOT_PASSWORD=feedback-minio-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs feedback-minio
          exit 1
      - name: clean baselineを空の通常 PostgreSQL で検証
        env:
          FEEDBACK_DATABASE_URL: jdbc:postgresql://localhost:5432/feedback
          FEEDBACK_DATABASE_USER: feedback
          FEEDBACK_DATABASE_PASSWORD: feedback
          FEEDBACK_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          FEEDBACK_TEST_S3_REGION: us-east-1
          FEEDBACK_TEST_S3_BUCKET: feedback-integration
          FEEDBACK_TEST_S3_ACCESS_KEY: feedback-minio
          FEEDBACK_TEST_S3_SECRET_KEY: feedback-minio-secret
        run: |
          mkdir -p "$RUNNER_TEMP/feedback-system"
          bash scripts/assemble-feedback-repository --output "$RUNNER_TEMP/feedback-system"
          cd "$RUNNER_TEMP/feedback-system/apps/feedback-service"
          ./gradlew integrationTest --no-daemon

  web:
    name: web verify (TypeScript)
    needs: scope
    if: needs.scope.outputs.web == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: 統合 verify (web スコープ)
        env:
          VERIFY_SCOPE: web
        run: bash scripts/verify.sh

  # branch protection の required check はこのジョブ 1 つを指定すればよい
  # (スコープ外でスキップされたジョブは成功扱い、失敗・キャンセルのみ落とす)
  verify-result:
    name: verify 結果集約
    needs: [scope, api, feedback, worker, web, api-integration, feedback-integration, worker-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 依存ジョブの結果を判定
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          case "$results" in
            *failure* | *cancelled*) echo "verify 失敗"; exit 1 ;;
            *) echo "verify 成功 (skipped はスコープ外)" ;;
          esac
